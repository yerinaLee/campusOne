version: '3.9'

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: uams-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: SysPass123!
      APP_USER: UAMS
      APP_USER_PASSWORD: UamsPass123!
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  oracle-data: